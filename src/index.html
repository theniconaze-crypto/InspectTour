        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Exporter en Excel
      </button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">${cards}</div>`;
}

function resultSummary(p, r) {
  if (p.type === 'numeric') return { text: r.value !== '' ? `${r.value}${p.unit ? ' ' + p.unit : ''}` : '—', bad: !!r.alert };
  if (p.type === 'conformity') return { text: r.status || '—', bad: r.status === 'NC' };
  if (p.type === 'text') return { text: (r.value && String(r.value).trim()) ? r.value : '—', bad: false };
  return { text: r.status === 'SIGNED' ? `${r.value} (signé le ${formatDate(r.signedAt)})` : 'Non signé', bad: r.status !== 'SIGNED' };
}

function viewEntry(entryId) {
  const e = findEntry(entryId);
  if (!e) return;
  const s = evalEntry(e);
  const items = e.points.map(p => {
    const r = e.results[p.id] || emptyResult();
    const sum = resultSummary(p, r);
    return `
      <div class="py-2.5 border-b border-slate-100 last:border-0">
        <p class="text-sm font-medium text-slate-800">${p.number ? escapeHtml(p.number) + '. ' : ''}${escapeHtml(p.name)}</p>
        <div class="flex justify-between gap-3 text-xs mt-0.5">
          <span class="text-slate-400">${escapeHtml(formatTargetLabel(p))}</span>
          <span class="font-semibold text-right ${sum.bad ? 'text-red-600' : 'text-slate-700'}">${escapeHtml(sum.text)}</span>
        </div>
        ${r.comment ? `<p class="text-xs text-red-600 mt-1">${escapeHtml(r.comment)}</p>` : ''}
      </div>`;
  }).join('');

  openModal(`
    <h3 class="text-lg font-bold text-slate-800">Relevé du ${formatDate(e.completedAt || e.date)}</h3>
    <p class="text-xs text-slate-400 mb-3">Opérateur : ${escapeHtml(e.operator || '—')} · Exécution ${pctText(s.exec)} · Conformité ${pctText(s.conf)}</p>
    <div class="max-h-[50vh] overflow-y-auto pr-1">${items}</div>
    ${visaBlock(e)}
    <div class="flex gap-2 mt-4">
      <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Fermer</button>
      <button onclick="closeModal(); printEntry('${e.id}')" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700">Rapport PDF</button>
    </div>`);
}

function printEntry(entryId) {
  const e = findEntry(entryId);
  if (!e) return;
  buildPrintArea({ name: e.tourName || getCurrentTour().name, points: e.points }, e);
  setTimeout(() => window.print(), 150);
}

function deleteEntry(entryId) {
  if (!requirePerm('edit')) return;
  confirmAction('Supprimer définitivement ce relevé de l\'historique ?', () => {
    state.history[currentTourId] = (state.history[currentTourId] || []).filter(e => e.id !== entryId);
    saveState();
    renderDetail();
    toast('Relevé supprimé', 'success');
  });
}

function exportHistoryExcel() {
  const tour = getCurrentTour();
  const hist = getHistory(tour.id);
  if (!hist.length) { toast('Aucun relevé à exporter', 'warning'); return; }

  const sum = [['Date', 'Opérateur', "Taux d'exécution (%)", 'Taux de conformité (%)', 'Anomalies', 'Points renseignés', 'Total points', 'Visa manager', 'Date du visa']];
  const det = [['Date', 'Opérateur', 'N°', 'Point de contrôle', 'Cible', 'Valeur / statut', 'État', 'Commentaire']];

  hist.forEach(e => {
    const s = evalEntry(e);
    const d = formatDate(e.completedAt || e.date);
    sum.push([d, e.operator || '', Math.round(s.exec), s.conf === null ? '' : Math.round(s.conf), s.anomalies, s.answered, s.total,
      e.managerVisa ? e.managerVisa.name : '', e.managerVisa ? formatDate(e.managerVisa.signedAt) : '']);
    e.points.forEach(p => {
      const r = e.results[p.id] || emptyResult();
      const rs = resultSummary(p, r);
      const hasState = p.type === 'numeric' || p.type === 'conformity';
      det.push([d, e.operator || '', p.number || '', p.name, formatTargetLabel(p), rs.text,
        hasState ? (rs.bad ? 'Anomalie' : 'OK') : '', r.comment || '']);
    });
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), 'Synthèse');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'Détail');
  XLSX.writeFile(wb, 'Historique_' + tour.name.replace(/[^\w\-]+/g, '_') + '.xlsx');
  toast('Export Excel généré', 'success');
}

/* ---- Onglet KPI ---- */

function filterByPeriod(hist) {
  if (detailPeriod === 'all') return hist;
  if (detailPeriod === 'last10') return hist.slice(-10);
  const limit = Date.now() - parseInt(detailPeriod, 10) * 86400000;
  return hist.filter(e => new Date(e.completedAt || e.date).getTime() >= limit);
}

function kpiCard(label, value, sub, colorClass) {
  return `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <p class="text-xs text-slate-400 mb-1">${label}</p>
      <p class="text-2xl font-bold ${colorClass}">${value}</p>
      <p class="text-[11px] text-slate-400 mt-1">${sub}</p>
    </div>`;
}

function renderKpiTab(tour, hist) {
  const periodOptions = [
    ['all', 'Toute la période'], ['last10', '10 derniers relevés'],
    ['7', '7 derniers jours'], ['30', '30 derniers jours'], ['90', '90 derniers jours']
  ].map(([v, l]) => `<option value="${v}" ${detailPeriod === v ? 'selected' : ''}>${l}</option>`).join('');

  const periodSelect = `
    <div class="flex items-center justify-between mb-4 gap-3">
      <h3 class="font-semibold text-slate-700">Indicateurs de performance</h3>
      <select onchange="setDetailPeriod(this.value)" class="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white outline-none focus:ring-2 focus:ring-indigo-200">${periodOptions}</select>
    </div>`;

  const stats = filterByPeriod(hist).map(e => ({ e, s: evalEntry(e) }));
  const n = stats.length;

  if (n === 0) {
    return periodSelect + `
      <div class="text-center py-14 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
        <i data-lucide="gauge" class="w-9 h-9 mx-auto mb-3"></i>
        <p class="font-medium">Pas encore de données pour calculer des KPI</p>
        <p class="text-sm">Terminez une tournée (ou élargissez la période) pour les voir apparaître.</p>
      </div>`;
  }

  const sum = f => stats.reduce((a, x) => a + f(x.s), 0);
  const exec = sum(s => s.exec) / n;
  const okTot = sum(s => s.ok), nokTot = sum(s => s.nok);
  const conf = (okTot + nokTot) > 0 ? (okTot / (okTot + nokTot)) * 100 : null;
  const anomalies = sum(s => s.anomalies);
  const complete = (stats.filter(x => x.s.answered === x.s.total).length / n) * 100;
  const sigSessions = stats.filter(x => x.s.sigTotal > 0);
  const sigRate = sigSessions.length
    ? (sigSessions.filter(x => x.s.sigDone === x.s.sigTotal).length / sigSessions.length) * 100 : null;
  const visaStats = stats.filter(x => x.e.managerVisa);
  const visaRate = (visaStats.length / n) * 100;
  const visaDelay = visaStats.length
    ? visaStats.reduce((a, x) => a + (new Date(x.e.managerVisa.signedAt) - new Date(x.e.completedAt || x.e.date)), 0) / visaStats.length / 3600000
    : null;
  const withAnomaly = (stats.filter(x => x.s.anomalies > 0).length / n) * 100;

  const cards = [
    kpiCard('Relevés réalisés', n, 'sur la période', 'text-slate-800'),
    kpiCard("Taux d'exécution moyen", pctText(exec), 'points renseignés / total', rateColor(exec)),
    kpiCard('Taux de conformité', pctText(conf), `${okTot} conforme(s) · ${nokTot} non conforme(s)`, rateColor(conf)),
    kpiCard('Anomalies', anomalies, `${(anomalies / n).toFixed(1)} par relevé · ${Math.round(withAnomaly)} % des relevés concernés`, anomalies > 0 ? 'text-red-500' : 'text-green-600'),
    kpiCard('Relevés 100 % complets', pctText(complete), 'tous les points renseignés', rateColor(complete)),
    kpiCard('Signatures complètes', pctText(sigRate), sigSessions.length ? 'relevés avec tous les VISA signés' : 'aucun VISA dans cette tournée', rateColor(sigRate)),
    kpiCard('Relevés visés (manager)', pctText(visaRate), `${visaStats.length} sur ${n} relevé(s)`, rateColor(visaRate)),
    kpiCard('Délai moyen de visa', visaDelay === null ? '—' : fmtDelay(visaDelay), 'entre la fin du relevé et le visa', 'text-slate-800')
  ].join('');

  // --- Top anomalies récurrentes ---
  const agg = {};
  stats.forEach(({ e }) => e.points.forEach(p => {
    const r = e.results[p.id];
    if (!r) return;
    if (!agg[p.id]) agg[p.id] = { name: p.name, number: p.number, count: 0, occ: 0 };
    agg[p.id].name = p.name;
    if (isPointAnswered(p, r)) agg[p.id].occ++;
    if (r.alert) agg[p.id].count++;
  }));
  const top = Object.values(agg).filter(a => a.count > 0).sort((a, b) => b.count - a.count).slice(0, 8);
  const topHtml = top.length ? top.map(a => `
    <div class="flex items-center justify-between gap-3 py-2.5 border-b border-slate-100 last:border-0">
      <p class="text-sm text-slate-700 min-w-0 truncate">${a.number ? escapeHtml(a.number) + '. ' : ''}${escapeHtml(a.name)}</p>
      <span class="flex-shrink-0 text-xs font-semibold px-2.5 py-1 rounded-full bg-red-100 text-red-700">${a.count} / ${a.occ}</span>
    </div>`).join('') : `<p class="text-sm text-slate-400 py-2">Aucune anomalie sur la période 🎉</p>`;

  // --- Par opérateur ---
  const ops = {};
  stats.forEach(({ e, s }) => {
    const k = (e.operator || '').trim() || '—';
    if (!ops[k]) ops[k] = { n: 0, exec: 0, ok: 0, nok: 0 };
    ops[k].n++; ops[k].exec += s.exec; ops[k].ok += s.ok; ops[k].nok += s.nok;
  });
  const opsHtml = Object.entries(ops).sort((a, b) => b[1].n - a[1].n).map(([name, o]) => {
    const c = (o.ok + o.nok) > 0 ? (o.ok / (o.ok + o.nok)) * 100 : null;
    return `
      <tr class="border-b border-slate-100 last:border-0">
        <td class="py-2.5 pr-2 text-slate-700">${escapeHtml(name)}</td>
        <td class="py-2.5 text-center">${o.n}</td>
        <td class="py-2.5 text-center font-semibold ${rateColor(o.exec / o.n)}">${pctText(o.exec / o.n)}</td>
        <td class="py-2.5 text-center font-semibold ${rateColor(c)}">${pctText(c)}</td>
      </tr>`;
  }).join('');

  // --- Suivi d'une valeur numérique ---
  const numericPoints = tour.points.filter(p => p.type === 'numeric' &&
    stats.some(({ e }) => e.results[p.id] && e.results[p.id].value !== '' && e.results[p.id].value !== undefined));
  let valueBlock = '';
  if (numericPoints.length) {
    if (!numericPoints.find(p => p.id === detailPointId)) detailPointId = numericPoints[0].id;
    const p = numericPoints.find(x => x.id === detailPointId);
    const series = [];
    stats.forEach(({ e }) => {
      const r = e.results[p.id];
      if (r && r.value !== '' && r.value !== undefined && isNumeric(r.value)) {
        series.push({ v: parseFloat(r.value), d: e.completedAt || e.date, alert: !!r.alert });
      }
    });
    const opts = numericPoints.map(x =>
      `<option value="${x.id}" ${x.id === detailPointId ? 'selected' : ''}>${escapeHtml((x.number ? x.number + '. ' : '') + x.name)}</option>`).join('');
    valueBlock = `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
          <h4 class="font-semibold text-slate-700 text-sm">Suivi d'une valeur relevée</h4>
          <select onchange="setDetailPoint(this.value)" class="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white outline-none focus:ring-2 focus:ring-indigo-200 max-w-full">${opts}</select>
        </div>
        <p class="text-xs text-slate-400 mb-2">Cible : ${escapeHtml(formatTargetLabel(p))}</p>
        ${renderValueChart(series, p)}
      </div>`;
  }

  return `
    ${periodSelect}
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-4">${cards}</div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-4">
      <h4 class="font-semibold text-slate-700 text-sm mb-3">Évolution par relevé</h4>
      ${renderTrendChart(stats)}
    </div>

    ${valueBlock}

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
        <h4 class="font-semibold text-slate-700 text-sm mb-1">Points les plus souvent en anomalie</h4>
        <p class="text-[11px] text-slate-400 mb-2">anomalies / relevés où le point a été renseigné</p>
        ${topHtml}
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
        <h4 class="font-semibold text-slate-700 text-sm mb-2">Par opérateur</h4>
        <table class="w-full text-sm">
          <thead><tr class="text-[11px] text-slate-400 text-left">
            <th class="pb-1 font-medium">Opérateur</th><th class="pb-1 font-medium text-center">Relevés</th>
            <th class="pb-1 font-medium text-center">Exéc.</th><th class="pb-1 font-medium text-center">Conf.</th>
          </tr></thead>
          <tbody>${opsHtml}</tbody>
        </table>
      </div>
    </div>`;
}

/** Courbes exécution / conformité par relevé (20 derniers) */
function renderTrendChart(stats) {
  const data = stats.slice(-20);
  const W = 600, H = 200, pl = 34, pr = 12, pt = 12, pb = 26;
  const x = i => data.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (data.length - 1);
  const y = v => pt + (H - pt - pb) * (1 - v / 100);

  let grid = '';
  [0, 25, 50, 75, 100].forEach(v => {
    grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0" stroke-width="1"/>
             <text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end" font-size="10" fill="#94a3b8">${v}</text>`;
  });

  function series(getter, color) {
    const pts = data.map((d, i) => ({ i, v: getter(d.s), d })).filter(p => p.v !== null && p.v !== undefined);
    if (!pts.length) return '';
    const line = pts.length > 1
      ? `<polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => `${x(p.i)},${y(p.v)}`).join(' ')}"/>` : '';
    const dots = pts.map(p => `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="4" fill="${color}"><title>${formatDate(p.d.e.completedAt || p.d.e.date)} : ${Math.round(p.v)} %</title></circle>`).join('');
    return line + dots;
  }

  const first = shortDate(data[0].e.completedAt || data[0].e.date);
  const last = shortDate(data[data.length - 1].e.completedAt || data[data.length - 1].e.date);
  const xLabels = data.length > 1
    ? `<text x="${pl}" y="${H - 8}" font-size="10" fill="#94a3b8">${first}</text><text x="${W - pr}" y="${H - 8}" text-anchor="end" font-size="10" fill="#94a3b8">${last}</text>`
    : `<text x="${W / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#94a3b8">${first}</text>`;

  return `
    <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">${grid}${xLabels}${series(s => s.exec, '#6366f1')}${series(s => s.conf, '#16a34a')}</svg>
    <div class="flex gap-4 text-xs text-slate-500 mt-2">
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span> Taux d'exécution</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-green-600 inline-block"></span> Taux de conformité</span>
    </div>`;
}

/** Évolution d'une valeur numérique avec seuils min / max */
function renderValueChart(series, p) {
  if (!series.length) return '<p class="text-sm text-slate-400">Aucune valeur relevée.</p>';
  const W = 600, H = 190, pl = 44, pr = 12, pt = 12, pb = 26;
  const vals = series.map(s => s.v);
  const hasMin = p.min !== null && p.min !== undefined;
  const hasMax = p.max !== null && p.max !== undefined;
  if (hasMin) vals.push(p.min);
  if (hasMax) vals.push(p.max);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;

  const x = i => series.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (series.length - 1);
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const fmt = v => String(Number(v.toFixed(2)));

  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#f1f5f9"/>
             <text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end" font-size="10" fill="#94a3b8">${fmt(v)}</text>`;
  }
  const thr = (v, label) => `
    <line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - pr}" y="${y(v) - 4}" text-anchor="end" font-size="10" fill="#ef4444">${label} ${fmt(v)}</text>`;

  const line = series.length > 1
    ? `<polyline fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" points="${series.map((s, i) => `${x(i)},${y(s.v)}`).join(' ')}"/>` : '';
  const dots = series.map((s, i) =>
    `<circle cx="${x(i)}" cy="${y(s.v)}" r="4.5" fill="${s.alert ? '#ef4444' : '#6366f1'}"><title>${formatDate(s.d)} : ${s.v}${p.unit ? ' ' + escapeHtml(p.unit) : ''}</title></circle>`).join('');

  const first = shortDate(series[0].d), last = shortDate(series[series.length - 1].d);
  const xLabels = series.length > 1
    ? `<text x="${pl}" y="${H - 8}" font-size="10" fill="#94a3b8">${first}</text><text x="${W - pr}" y="${H - 8}" text-anchor="end" font-size="10" fill="#94a3b8">${last}</text>`
    : `<text x="${W / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#94a3b8">${first}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">${grid}${hasMin ? thr(p.min, 'min') : ''}${hasMax ? thr(p.max, 'max') : ''}${xLabels}${line}${dots}</svg>`;
}


/* --------------------------- 11c. DOSSIERS ------------------------------- */

/** Modale générique de saisie d'un nom */
function askName(title, initial, okLabel, onOk) {
  openModal(`
    <h3 class="text-lg font-bold mb-4 text-slate-800">${escapeHtml(title)}</h3>
    <input id="ask-name-input" value="${escapeHtml(initial || '')}" placeholder="Nom du dossier"
      class="w-full border border-slate-200 rounded-xl px-3 py-3 outline-none focus:ring-2 focus:ring-indigo-200">
    <div class="flex gap-2 mt-5">
      <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Annuler</button>
      <button id="ask-name-ok" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700">${escapeHtml(okLabel)}</button>
    </div>`);
  const input = document.getElementById('ask-name-input');
  const submit = () => {
    const v = input.value.trim();
    if (!v) { toast('Le nom est requis', 'error'); return; }
    closeModal();
    onOk(v);
  };
  document.getElementById('ask-name-ok').onclick = submit;
  input.addEventListener('keydown', ev => { if (ev.key === 'Enter') submit(); });
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

function createFolder(onCreated) {
  if (!requirePerm('edit')) return;
  askName('Nouveau dossier', '', 'Créer', name => {
    const f = { id: genId(), name, collapsed: false };
    state.folders.push(f);
    saveState();
    renderHome();
    toast('Dossier créé', 'success');
    if (typeof onCreated === 'function') onCreated(f);
  });
}

function renameFolder(folderId) {
  if (!requirePerm('edit')) return;
  const f = state.folders.find(x => x.id === folderId);
  if (!f) return;
  askName('Renommer le dossier', f.name, 'Enregistrer', name => {
    f.name = name;
    saveState();
    renderHome();
  });
}

function confirmDeleteFolder(folderId) {
  if (!requirePerm('edit')) return;
  const f = state.folders.find(x => x.id === folderId);
  if (!f) return;
  confirmAction(`Supprimer le dossier « ${f.name} » ? Les tournées qu'il contient ne sont pas supprimées : elles repassent « sans dossier ».`, () => {
    state.tours.forEach(t => { if (t.folderId === folderId) t.folderId = null; });
    state.folders = state.folders.filter(x => x.id !== folderId);
    saveState();
    renderHome();
    toast('Dossier supprimé', 'success');
  });
}

function toggleFolder(folderId) {
  const f = state.folders.find(x => x.id === folderId);
  if (!f) return;
  f.collapsed = !f.collapsed;
  saveState();
  renderHome();
}

function openMoveModal(tourId) {
  if (!requirePerm('edit')) return;
  const tour = state.tours.find(t => t.id === tourId);
  if (!tour) return;
  const options = [{ id: null, name: 'Sans dossier' }, ...state.folders].map(f => {
    const current = (tour.folderId || null) === f.id;
    return `
      <button onclick="moveTour('${tourId}', ${f.id ? `'${f.id}'` : 'null'})"
        class="w-full text-left px-3.5 py-3 rounded-xl border-2 font-medium flex items-center gap-2.5 ${current ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-100 hover:border-indigo-200'}">
        <i data-lucide="${f.id ? 'folder' : 'inbox'}" class="w-4 h-4 flex-shrink-0"></i>
        <span class="truncate">${escapeHtml(f.name)}</span>
        ${current ? '<i data-lucide="check" class="w-4 h-4 ml-auto flex-shrink-0"></i>' : ''}
      </button>`;
  }).join('');

  openModal(`
    <h3 class="text-lg font-bold text-slate-800">Déplacer la tournée</h3>
    <p class="text-xs text-slate-400 mb-4 truncate">${escapeHtml(tour.name)}</p>
    <div class="space-y-2 max-h-[45vh] overflow-y-auto">${options}</div>
    <button onclick="closeModal(); createFolder(function(f){ moveTour('${tourId}', f.id); })"
      class="w-full mt-3 py-3 rounded-xl border-2 border-dashed border-slate-300 text-slate-600 font-medium flex items-center justify-center gap-2 hover:border-indigo-400 hover:text-indigo-600">
      <i data-lucide="folder-plus" class="w-4 h-4"></i> Nouveau dossier
    </button>
    <button onclick="closeModal()" class="w-full mt-2 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Annuler</button>`);
}

function moveTour(tourId, folderId) {
  if (!requirePerm('edit')) return;
  const tour = state.tours.find(t => t.id === tourId);
  if (!tour) return;
  tour.folderId = folderId || null;
  const f = folderId ? state.folders.find(x => x.id === folderId) : null;
  if (f) f.collapsed = false;
  saveState();
  closeModal();
  renderHome();
  toast(f ? `Déplacée dans « ${f.name} »` : 'Tournée retirée du dossier', 'success');
}

/** Après un import Excel multi-zones : propose de les ranger d'un coup dans un dossier */
function proposeFolderForImport(tourIds, fileName) {
  const base = String(fileName || '').replace(/\.[^.]+$/, '');
  askName(`Ranger les ${tourIds.length} tournées importées dans un dossier ?`, base, 'Créer le dossier', name => {
    const f = { id: genId(), name, collapsed: false };
    state.folders.push(f);
    state.tours.forEach(t => { if (tourIds.includes(t.id)) t.folderId = f.id; });
    saveState();
    renderHome();
    toast(`Dossier « ${name} » créé`, 'success');
  });
}


/* --------------------------- 11d. VISA MANAGER --------------------------- */

function pendingVisaCount(tourId) {
  return (state.history[tourId] || []).filter(e => !e.managerVisa).length;
}

function pendingVisaChip(tourId) {
  if (!can('visa')) return '';
  const n = pendingVisaCount(tourId);
  if (!n) return '';
  return `<button onclick="openDetail('${tourId}')" class="flex items-center gap-1.5 text-xs text-amber-600 font-medium hover:underline text-left">
    <i data-lucide="pen-tool" class="w-3.5 h-3.5 flex-shrink-0"></i> ${n} relevé(s) en attente de visa manager</button>`;
}

function fmtDelay(hours) {
  if (hours < 1) return '< 1 h';
  if (hours < 48) return Math.round(hours) + ' h';
  return Math.round(hours / 24) + ' j';
}

/** Bloc d'affichage du visa manager d'un relevé archivé (visa apposé, ou bouton pour le poser) */
function visaBlock(e) {
  if (e.managerVisa) {
    return `
      <div class="mt-3 bg-green-50 border border-green-200 rounded-xl px-3 py-2.5 flex items-start gap-2.5">
        <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center flex-shrink-0">
          <i data-lucide="shield-check" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-green-800 truncate">Visa manager : ${escapeHtml(e.managerVisa.name)}</p>
          <p class="text-xs text-green-600">Signé électroniquement le ${formatDate(e.managerVisa.signedAt)}</p>
          ${e.managerVisa.comment ? `<p class="text-xs text-slate-600 mt-1">« ${escapeHtml(e.managerVisa.comment)} »</p>` : ''}
        </div>
      </div>`;
  }
  return `
    <button onclick="openManagerVisa('${e.id}')" class="mt-3 w-full py-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-700 text-sm font-semibold flex items-center justify-center gap-2 hover:bg-amber-100 active:scale-[0.98] transition">
      <i data-lucide="pen-tool" class="w-4 h-4"></i> Apposer le visa manager
    </button>`;
}

function openManagerVisa(entryId) {
  if (!requirePerm('visa')) return;
  const e = findEntry(entryId);
  if (!e || e.managerVisa) return;
  const s = evalEntry(e);
  openModal(`
    <h3 class="text-lg font-bold text-slate-800">Visa du manager</h3>
    <p class="text-xs text-slate-400 mb-4">Relevé du ${formatDate(e.completedAt || e.date)} · ${escapeHtml(e.operator || '—')}<br>
      Exécution ${pctText(s.exec)} · Conformité ${pctText(s.conf)} · ${s.anomalies} anomalie(s)</p>
    <label class="text-xs font-medium text-slate-500">Signataire (compte connecté)</label>
    <input id="mv-name" value="${escapeHtml(currentUser.displayName)}" readonly
      class="w-full border-2 border-slate-200 bg-slate-50 text-slate-700 rounded-xl px-3 py-3 mt-1 text-sm font-medium outline-none">
    <label class="text-xs font-medium text-slate-500 mt-3 block">Commentaire (optionnel)</label>
    <textarea id="mv-comment" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 mt-1 text-sm outline-none focus:ring-2 focus:ring-indigo-200 resize-none" placeholder="Remarque du manager, actions à suivre..."></textarea>
    <p class="text-xs text-slate-400 mt-2">Le visa est horodaté et définitif : il ne pourra plus être modifié.</p>
    <div class="flex gap-2 mt-5">
      <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Plus tard</button>
      <button id="mv-ok" onclick="confirmManagerVisa('${e.id}')"
        class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-semibold flex items-center justify-center gap-2 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed">
        <i data-lucide="pen-tool" class="w-4 h-4"></i> Viser
      </button>
    </div>`);
  setTimeout(() => { const i = document.getElementById('mv-comment'); if (i) i.focus(); }, 50);
}

function confirmManagerVisa(entryId) {
  if (!requirePerm('visa')) return;
  const e = findEntry(entryId);
  if (!e || e.managerVisa) return;
  const name = currentUser.displayName;
  const comment = document.getElementById('mv-comment').value.trim();
  if (!name) { toast('Veuillez saisir le nom du manager', 'error'); return; }

  confirmAction(`Confirmer le visa électronique de « ${name} » ? Cette action est définitive, horodatée, et ne pourra plus être modifiée.`, () => {
    e.managerVisa = { name, comment, userId: currentUser.id, signedAt: new Date().toISOString() };
    saveState();
    updateHeaderUser();
    if (!document.getElementById('view-detail').classList.contains('hidden')) renderDetail();
    else if (!document.getElementById('view-home').classList.contains('hidden')) renderHome();
    else openDetail(currentTourId);
    toast('Visa manager enregistré', 'success');
  }, 'Viser');
}


/* --------------------------- 12. INITIALISATION -------------------------- */

document.addEventListener('DOMContentLoaded', async () => {

  loadState();

  if (!localStorage.getItem(STORAGE_KEY)) {
    seedDemoData();
    saveState();
  }

  document.getElementById('btn-back').onclick = () => showView('home');

  const dateInput = document.getElementById('exec-date');
  if (dateInput) dateInput.value = new Date().toISOString().substring(0, 10);

  await ensureDefaultAdmin();
  loadSession();
  document.getElementById('login-username').addEventListener('keydown', ev => { if (ev.key === 'Enter') document.getElementById('login-password').focus(); });
  document.getElementById('login-password').addEventListener('keydown', ev => { if (ev.key === 'Enter') doLogin(); });

  showView(currentUser ? 'home' : 'login');
  lucide.createIcons();
});
</script>
</body>
</html>
