<script>
/* =========================================================================
   INSPECTOUR — Application de gestion de tournées d'inspection
   ========================================================================= */

/* --------------------------- 1. ÉTAT GLOBAL --------------------------- */
const STORAGE_KEY = 'inspectour_data_v3';

let state = {
  tours: [],
  sessions: {},
  history: {},  // tourId -> [ relevés terminés archivés ]
  folders: [],  // [{ id, name, collapsed }] — les tournées y sont rattachées via tour.folderId
  users: []     // comptes : { id, username, displayName, role, salt, hash, mustChange, active }
};

let currentTourId = null;


/* --------------------------- 2. UTILITAIRES ---------------------------- */

function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  }[m]));
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
    ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function isNumeric(v) {
  if (v === '' || v === null || v === undefined) return false;
  return !isNaN(parseFloat(v)) && isFinite(v);
}

function getCurrentTour() {
  return state.tours.find(t => t.id === currentTourId);
}

function toast(message, type = 'info') {
  const styles = {
    success: { bg: 'bg-green-600', icon: 'check-circle' },
    error:   { bg: 'bg-red-600',   icon: 'x-circle' },
    warning: { bg: 'bg-amber-500', icon: 'alert-triangle' },
    info:    { bg: 'bg-slate-700', icon: 'info' }
  };
  const s = styles[type] || styles.info;
  const el = document.createElement('div');
  el.className = `toast-fade flex items-center gap-2 ${s.bg} text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg animate-slide-in max-w-sm`;
  el.innerHTML = `<i data-lucide="${s.icon}" class="w-4 h-4 flex-shrink-0"></i><span>${escapeHtml(message)}</span>`;
  document.getElementById('toast-container').appendChild(el);
  lucide.createIcons();
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
  }, 4000);
}


/* --------------------------- 3. PERSISTANCE ---------------------------- */

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Erreur de sauvegarde', err);
    toast("Erreur de sauvegarde : stockage local plein (photos trop volumineuses ?)", 'error');
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
    if (!state.tours) state.tours = [];
    if (!state.sessions) state.sessions = {};
    if (!state.history) state.history = {};
    if (!state.folders) state.folders = [];
    if (!state.users) state.users = [];

    // Migration : les tournées déjà terminées avant l'arrivée de l'historique y sont archivées
    let migrated = false;
    state.tours.forEach(tour => {
      const s = state.sessions[tour.id];
      if (s && s.status === 'completed' && !s.archivedId) {
        archiveSession(tour, s);
        migrated = true;
      }
    });
    if (migrated) localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Erreur de chargement des données', err);
    toast("Impossible de charger les données enregistrées.", 'error');
  }
}

/** Données de démonstration — reflète le format réel des fiches (cf capture) */
function seedDemoData() {
  const points = [
    pt('1', 'Relever pression bouteille oxygène', '10<p<200'),
    pt('2', 'Relever pression pré-détente', '< 8.5'),
    pt('3', 'Relever pression détente', '< 1'),
    pt('4', 'Contrôler présence bouteilles (vide/pleine)', 'C'),
    pt('5', 'Contrôle pression - VM105', '> 2.5bar'),
    pt('6', 'Relever Δp', '< 1'),
    pt('8', 'Relever puissance UV101', '110<x<150'),
    pt('12', 'Contrôle capteur ozone ambiants x2', '<0 = C'),
    pt('22', 'Relever T° UV 101', '10°<T<25°'),
    pt('29', 'Contrôle Test lampes armoire', 'C'),
    pt('30', 'Relever Temps Ozonation week-end', '?'),
    pt(null, 'Contrôle absence bruits anormaux', 'C'),
    pt(null, 'Contrôle zone propre', 'C'),
    pt(null, 'Contrôle absence eau sur le sol', 'C'),
    pt(null, 'Eteindre les lumières en sortant', 'C'),
    // --- Champs spécifiques : texte libre & signatures électroniques ---
    { id: genId(), number: null, name: 'Points de Vigilance:', type: 'text', targetRaw: 'Texte libre', unit: '', target: null, min: null, max: null },
    { id: genId(), number: null, name: 'VISA Executant', type: 'signature', targetRaw: 'Signature électronique', unit: '', target: null, min: null, max: null },
    { id: genId(), number: null, name: 'VISA Manager Utilités', type: 'signature', targetRaw: 'Signature électronique', unit: '', target: null, min: null, max: null },
    { id: genId(), number: null, name: 'Commentaires:', type: 'text', targetRaw: 'Texte libre', unit: '', target: null, min: null, max: null }
  ];

  state.tours.push({
    id: genId(),
    name: 'ZONE A25 - Station CHRIST',
    description: "Exemple de tournée (données de démonstration)",
    createdAt: Date.now(),
    points
  });

  /** Mini-helper local pour construire un point à partir d'une cible brute (démo) */
  function pt(number, name, targetRaw) {
    const parsed = parseTargetExpression(targetRaw);
    return {
      id: genId(), number, name,
      type: parsed.type, targetRaw,
      unit: parsed.unit, target: parsed.target,
      min: parsed.min, max: parsed.max
    };
  }
}


/* --------------------------- 3b. COMPTES & DROITS ----------------------- */

const DEFAULT_ADMIN = { username: 'admin', password: 'totototo', displayName: 'Administrateur' };
const ROLE_LABELS = { admin: 'Administrateur', manager: 'Manager', user: 'Utilisateur' };
/* Droits par profil (modifier ici pour ajuster) :
   edit    = créer/éditer/supprimer tournées, import Excel, dossiers
   history = historique, KPI, exports
   visa    = apposer le visa manager + signer les points « Manager »
   users   = gestion des comptes */
const ROLES_CAN = {
  edit: ['admin', 'manager'],
  history: ['admin', 'manager'],
  visa: ['admin', 'manager'],
  users: ['admin']
};
const MIN_PASSWORD = 6;
let currentUser = null;
let modalLocked = false;

function can(perm) { return !!currentUser && (ROLES_CAN[perm] || []).includes(currentUser.role); }
function requirePerm(perm) {
  if (can(perm)) return true;
  toast("Action non autorisée pour votre profil", 'error');
  return false;
}

async function hashPassword(salt, pwd) {
  const data = salt + ':' + pwd;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381;
  for (let i = 0; i < data.length; i++) h = ((h << 5) + h) ^ data.charCodeAt(i);
  return 'x' + (h >>> 0).toString(16);
}

function randomSalt() {
  const a = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function makeUser({ username, displayName, role, password, mustChange }) {
  const salt = randomSalt();
  return {
    id: genId(), username, displayName, role,
    salt, hash: await hashPassword(salt, password),
    mustChange: !!mustChange, active: true, createdAt: Date.now()
  };
}

async function setUserPassword(user, password, mustChange) {
  user.salt = randomSalt();
  user.hash = await hashPassword(user.salt, password);
  user.mustChange = !!mustChange;
}

/** Première utilisation : crée le compte admin avec le mot de passe par défaut */
async function ensureDefaultAdmin() {
  if (!state.users) state.users = [];
  if (!state.users.some(u => u.role === 'admin')) {
    state.users.push(await makeUser({
      username: DEFAULT_ADMIN.username, displayName: DEFAULT_ADMIN.displayName,
      role: 'admin', password: DEFAULT_ADMIN.password, mustChange: true
    }));
    saveState();
  }
}

function loadSession() {
  try {
    const id = sessionStorage.getItem('inspectour_uid');
    if (id) {
      const u = state.users.find(x => x.id === id && x.active !== false);
      if (u && !u.mustChange) currentUser = u;
    }
  } catch (e) { /* non bloquant */ }
}

function renderLogin() {
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-password').value = '';
  const adm = state.users.find(u => u.role === 'admin');
  const hint = document.getElementById('login-hint');
  if (adm && adm.mustChange) {
    hint.classList.remove('hidden');
    hint.innerHTML = `Première utilisation : identifiant <b>${escapeHtml(DEFAULT_ADMIN.username)}</b> · mot de passe <b>${escapeHtml(DEFAULT_ADMIN.password)}</b>.<br>Vous devrez le changer dès la première connexion.`;
  } else {
    hint.classList.add('hidden');
  }
  setTimeout(() => { const i = document.getElementById('login-username'); if (i) i.focus(); }, 50);
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim().toLowerCase();
  const pwd = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  const fail = msg => { err.textContent = msg; };

  if (!username || !pwd) { fail('Renseignez l\'identifiant et le mot de passe.'); return; }
  const u = state.users.find(x => x.username.toLowerCase() === username);
  if (!u || u.active === false) { fail(u ? 'Ce compte est désactivé.' : 'Identifiant ou mot de passe incorrect.'); return; }
  const h = await hashPassword(u.salt, pwd);
  if (h !== u.hash) { fail('Identifiant ou mot de passe incorrect.'); return; }

  currentUser = u;
  try { sessionStorage.setItem('inspectour_uid', u.id); } catch (e) { /* non bloquant */ }
  document.getElementById('login-password').value = '';
  err.textContent = '';
  if (u.mustChange) openChangePassword(true);
  else afterLogin();
}

function afterLogin() {
  showView('home');
  toast(`Bienvenue ${currentUser.displayName}`, 'success');
  if (can('visa')) {
    const n = totalPendingVisas();
    if (n > 0) setTimeout(() => toast(`${n} relevé(s) en attente de votre visa`, 'warning'), 600);
  }
}

function logout() {
  currentUser = null;
  currentTourId = null;
  try { sessionStorage.removeItem('inspectour_uid'); } catch (e) { /* non bloquant */ }
  closeModal();
  showView('login');
}

function updateHeaderUser() {
  const box = document.getElementById('header-user');
  if (!box) return;
  if (!currentUser) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  document.getElementById('hdr-user-name').textContent = currentUser.displayName;
  document.getElementById('hdr-user-role').textContent = ROLE_LABELS[currentUser.role] || '';
  const bell = document.getElementById('btn-bell');
  const n = can('visa') ? totalPendingVisas() : 0;
  bell.classList.toggle('hidden', !can('visa'));
  const badge = document.getElementById('bell-badge');
  badge.textContent = n > 99 ? '99+' : n;
  badge.classList.toggle('hidden', n === 0);
}

function applyRoleUI() {
  const actions = document.getElementById('home-actions');
  if (actions) actions.classList.toggle('hidden', !can('edit'));
  const btnUsers = document.getElementById('btn-users');
  if (btnUsers) btnUsers.classList.toggle('hidden', !can('users'));
}

function openChangePassword(forced) {
  openModal(`
    <h3 class="text-lg font-bold mb-2 text-slate-800">${forced ? 'Définir votre mot de passe' : 'Changer mon mot de passe'}</h3>
    ${forced ? `<p class="text-sm text-slate-500 mb-4">Pour sécuriser votre compte, choisissez un mot de passe personnel (${MIN_PASSWORD} caractères minimum).</p>` : '<div class="mb-2"></div>'}
    ${forced ? '' : `<label class="text-xs font-medium text-slate-500">Mot de passe actuel</label>
      <input id="pw-current" type="password" autocomplete="current-password" class="w-full border border-slate-200 rounded-xl px-3 py-3 mt-1 mb-3 outline-none focus:ring-2 focus:ring-indigo-200">`}
    <label class="text-xs font-medium text-slate-500">Nouveau mot de passe</label>
    <input id="pw-new" type="password" autocomplete="new-password" class="w-full border border-slate-200 rounded-xl px-3 py-3 mt-1 mb-3 outline-none focus:ring-2 focus:ring-indigo-200">
    <label class="text-xs font-medium text-slate-500">Confirmer le nouveau mot de passe</label>
    <input id="pw-confirm" type="password" autocomplete="new-password" class="w-full border border-slate-200 rounded-xl px-3 py-3 mt-1 outline-none focus:ring-2 focus:ring-indigo-200">
    <p id="pw-error" class="text-sm text-red-600 mt-3 min-h-[1.25rem]"></p>
    <div class="flex gap-2 mt-3">
      ${forced
        ? `<button onclick="modalLocked = false; logout()" class="flex-1 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Se déconnecter</button>`
        : `<button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Annuler</button>`}
      <button onclick="submitPasswordChange(${forced ? 'true' : 'false'})" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Enregistrer</button>
    </div>`);
  if (forced) modalLocked = true;
}

async function submitPasswordChange(forced) {
  const err = document.getElementById('pw-error');
  const nw = document.getElementById('pw-new').value;
  const cf = document.getElementById('pw-confirm').value;
  if (!forced) {
    const cur = document.getElementById('pw-current').value;
    if ((await hashPassword(currentUser.salt, cur)) !== currentUser.hash) { err.textContent = 'Mot de passe actuel incorrect.'; return; }
  }
  if (nw.length < MIN_PASSWORD) { err.textContent = `Le mot de passe doit contenir au moins ${MIN_PASSWORD} caractères.`; return; }
  if (nw === DEFAULT_ADMIN.password) { err.textContent = 'Choisissez un mot de passe différent du mot de passe par défaut.'; return; }
  if (nw !== cf) { err.textContent = 'La confirmation ne correspond pas.'; return; }

  await setUserPassword(currentUser, nw, false);
  saveState();
  modalLocked = false;
  closeModal();
  toast('Mot de passe enregistré', 'success');
  if (forced) afterLogin();
}

  const roleIcon = { admin: 'shield', manager: 'user-check', user: 'user' };
  document.getElementById('users-list').innerHTML = state.users.map(u => {
    const self = currentUser && u.id === currentUser.id;
    const inactive = u.active === false;
    return `
      <div class="bg-white rounded-xl border border-slate-100 p-3 flex items-center gap-3 shadow-sm ${inactive ? 'opacity-60' : ''}">
        <div class="w-9 h-9 rounded-full ${roleStyle[u.role] || roleStyle.user} flex items-center justify-center flex-shrink-0"><i data-lucide="${roleIcon[u.role] || 'user'}" class="w-4 h-4"></i></div>

          <p class="text-xs text-slate-400 truncate">@${escapeHtml(u.username)} · ${ROLE_LABELS[u.role] || u.role}${inactive ? ' · désactivé' : ''}${u.mustChange ? ' · mot de passe à changer' : ''}</p>
        </div>
        <button onclick="openUserModal('${u.id}')" class="p-2 rounded-lg hover:bg-slate-100 flex-shrink-0" title="Modifier"><i data-lucide="pencil" class="w-4 h-4 text-slate-500"></i></button>
        <button onclick="openResetPassword('${u.id}')" class="p-2 rounded-lg hover:bg-slate-100 flex-shrink-0" title="Réinitialiser le mot de passe"><i data-lucide="key-round" class="w-4 h-4 text-slate-500"></i></button>
        ${self ? '' : `
        <button onclick="toggleUserActive('${u.id}')" class="p-2 rounded-lg hover:bg-slate-100 flex-shrink-0" title="${inactive ? 'Réactiver' : 'Désactiver'}"><i data-lucide="${inactive ? 'user-check' : 'user-x'}" class="w-4 h-4 text-slate-500"></i></button>

async function saveUser(userId) {
  if (!requirePerm('users')) return;
  const err = document.getElementById('uf-error');
  const displayName = document.getElementById('uf-display').value.trim();
  const roleEl = document.getElementById('uf-role');
  if (!displayName) { err.textContent = 'Le nom affiché est requis.'; return; }

  if (userId) {
    const u = state.users.find(x => x.id === userId);
    if (!u) return;
    u.displayName = displayName;
    if (roleEl && u.role !== 'admin') u.role = roleEl.value;
    saveState();
    closeModal();
    renderUsers();
    toast('Compte modifié', 'success');
    return;
  }

  const username = document.getElementById('uf-username').value.trim();
  const password = document.getElementById('uf-password').value;
  if (!/^[A-Za-z0-9._-]{3,}$/.test(username)) { err.textContent = 'Identifiant : 3 caractères minimum (lettres, chiffres, . _ -).'; return; }
  if (state.users.some(x => x.username.toLowerCase() === username.toLowerCase())) { err.textContent = 'Cet identifiant existe déjà.'; return; }
  if (password.length < MIN_PASSWORD) { err.textContent = `Le mot de passe doit contenir au moins ${MIN_PASSWORD} caractères.`; return; }

  state.users.push(await makeUser({ username, displayName, role: roleEl.value, password, mustChange: true }));
  saveState();
  closeModal();
  renderUsers();
  toast('Compte créé', 'success');
}

function openResetPassword(userId) {
  if (!requirePerm('users')) return;
  const u = state.users.find(x => x.id === userId);
  if (!u) return;
  openModal(`
    <h3 class="text-lg font-bold text-slate-800">Réinitialiser le mot de passe</h3>
    <p class="text-xs text-slate-400 mb-4">${escapeHtml(u.displayName)} (@${escapeHtml(u.username)})</p>
    <label class="text-xs font-medium text-slate-500">Nouveau mot de passe provisoire</label>
    <input id="rp-password" type="text" autocapitalize="none" class="w-full border border-slate-200 rounded-xl px-3 py-3 mt-1 outline-none focus:ring-2 focus:ring-indigo-200" placeholder="${MIN_PASSWORD} caractères minimum">
    <p class="text-xs text-slate-400 mt-1">La personne devra le remplacer à sa prochaine connexion.</p>
    <p id="rp-error" class="text-sm text-red-600 mt-3 min-h-[1.25rem]"></p>
    <div class="flex gap-2 mt-3">
      <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Annuler</button>
      <button onclick="confirmResetPassword('${u.id}')" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700">Réinitialiser</button>
    </div>`);
}

async function confirmResetPassword(userId) {
  if (!requirePerm('users')) return;
  const u = state.users.find(x => x.id === userId);
  const pwd = document.getElementById('rp-password').value;
  if (!u) return;
  if (pwd.length < MIN_PASSWORD) { document.getElementById('rp-error').textContent = `Au moins ${MIN_PASSWORD} caractères.`; return; }
  await setUserPassword(u, pwd, true);
  saveState();
  closeModal();
  renderUsers();
  toast('Mot de passe réinitialisé', 'success');
}

function toggleUserActive(userId) {
  if (!requirePerm('users')) return;
  const u = state.users.find(x => x.id === userId);
  if (!u || u.id === currentUser.id || u.role === 'admin') return;
  u.active = u.active === false;
  saveState();
  renderUsers();
  toast(u.active ? 'Compte réactivé' : 'Compte désactivé', 'success');
}

function deleteUser(userId) {
  if (!requirePerm('users')) return;
  const u = state.users.find(x => x.id === userId);
  if (!u || u.id === currentUser.id || u.role === 'admin') return;
  confirmAction(`Supprimer le compte « ${u.displayName} » ? Les relevés déjà réalisés sont conservés.`, () => {
    state.users = state.users.filter(x => x.id !== userId);
    saveState();
    renderUsers();
    toast('Compte supprimé', 'success');
  });
}

/* ---- Visas en attente (notifications manager) ---- */

function allPendingVisas() {
  const out = [];
  state.tours.forEach(t => {
    (state.history[t.id] || []).forEach(e => { if (!e.managerVisa) out.push({ tour: t, entry: e }); });
  });
  return out.sort((a, b) => new Date(a.entry.completedAt || a.entry.date) - new Date(b.entry.completedAt || b.entry.date));
}

function totalPendingVisas() {
  return allPendingVisas().length;
}

function renderHomeBanner() {
  const el = document.getElementById('home-banner');
  if (!el) return;
  const n = can('visa') ? totalPendingVisas() : 0;
  el.innerHTML = n ? `
    <button onclick="openPendingVisas()" class="w-full mb-5 text-left bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 flex items-center gap-3 hover:bg-amber-100 active:scale-[0.99] transition">
      <div class="w-9 h-9 rounded-full bg-amber-500 text-white flex items-center justify-center flex-shrink-0"><i data-lucide="bell-ring" class="w-5 h-5"></i></div>
      <div class="min-w-0 flex-1">
        <p class="font-semibold text-amber-800">${n} relevé(s) en attente de votre visa</p>
        <p class="text-xs text-amber-700">Touchez pour consulter et viser</p>
      </div>
      <i data-lucide="chevron-right" class="w-5 h-5 text-amber-600 flex-shrink-0"></i>
    </button>` : '';
}

function openPendingVisas() {
  if (!requirePerm('visa')) return;
  const list = allPendingVisas();
  const items = list.length ? list.map(({ tour, entry }) => `
    <div class="py-3 border-b border-slate-100 last:border-0">
      <p class="text-sm font-semibold text-slate-800 truncate">${escapeHtml(tour.name)}</p>
      <p class="text-xs text-slate-400">${formatDate(entry.completedAt || entry.date)} · ${escapeHtml(entry.operator || '—')}</p>
      <div class="flex gap-2 mt-2">
        <button onclick="closeModal(); openDetail('${tour.id}')" class="flex-1 py-2 rounded-xl bg-slate-100 text-sm font-medium hover:bg-slate-200 flex items-center justify-center gap-1.5"><i data-lucide="eye" class="w-4 h-4"></i> Consulter</button>
        <button onclick="closeModal(); currentTourId='${tour.id}'; openManagerVisa('${entry.id}')" class="flex-1 py-2 rounded-xl bg-amber-500 text-white text-sm font-semibold hover:bg-amber-600 flex items-center justify-center gap-1.5"><i data-lucide="pen-tool" class="w-4 h-4"></i> Viser</button>
      </div>
    </div>`).join('') : '<p class="text-sm text-slate-400 py-6 text-center">Aucun relevé en attente de visa 🎉</p>';
  openModal(`
    <h3 class="text-lg font-bold text-slate-800 mb-1">Visas en attente</h3>
    <p class="text-xs text-slate-400 mb-2">${list.length} relevé(s) à viser</p>
    <div class="max-h-[55vh] overflow-y-auto pr-1">${items}</div>
    <button onclick="closeModal()" class="w-full mt-4 py-3 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Fermer</button>`);
}

/** Les points de signature « Manager » sont réservés aux profils autorisés à viser */
function isManagerSignaturePoint(p) { return p.type === 'signature' && /manager/i.test(p.name || ''); }
function canSignPoint(p) { return !isManagerSignaturePoint(p) || can('visa'); }


/* --------------------------- 4. NAVIGATION ------------------------------ */

function showView(view) {
  if (!currentUser && view !== 'login') view = 'login';
  if (view === 'users' && !can('users')) view = 'home';
  if (view === 'editor' && !can('edit')) view = 'home';
  if (view === 'detail' && !can('history')) view = 'home';

  document.querySelectorAll('#view-login, #view-home, #view-editor, #view-execution, #view-detail, #view-users').forEach(v => v.classList.add('hidden'));
  document.getElementById('view-' + view).classList.remove('hidden');

  const backBtn = document.getElementById('btn-back');
  const title = document.getElementById('header-title');
  const subtitle = document.getElementById('header-subtitle');

  if (view === 'login') {
    backBtn.classList.add('hidden');
    title.textContent = 'InspecTour';
    subtitle.textContent = "Gestion des tournées d'inspection";
    renderLogin();
  } else if (view === 'home') {
    backBtn.classList.add('hidden');
    title.textContent = 'InspecTour';
    subtitle.textContent = "Gestion des tournées d'inspection";
    renderHome();
  } else if (view === 'users') {
    backBtn.classList.remove('hidden');
    title.textContent = 'Utilisateurs';
    subtitle.textContent = 'Gestion des comptes';
    renderUsers();
  } else if (view === 'editor') {
    backBtn.classList.remove('hidden');
    title.textContent = 'Édition de la tournée';
    subtitle.textContent = getCurrentTour()?.name || '';
    renderEditor();
  } else if (view === 'execution') {
    backBtn.classList.remove('hidden');
    title.textContent = 'Tournée en cours';
    subtitle.textContent = getCurrentTour()?.name || '';
  } else if (view === 'detail') {
    backBtn.classList.remove('hidden');
    title.textContent = 'Historique & KPI';
    subtitle.textContent = getCurrentTour()?.name || '';
    renderDetail();
  }
  updateHeaderUser();
  window.scrollTo(0, 0);
}


/* --------------------------- 5. MODALES ---------------------------- */

function openModal(innerHtml) {
  modalLocked = false;
  document.getElementById('modal-content').innerHTML = innerHtml;
  document.getElementById('modal-overlay').classList.remove('hidden');
  lucide.createIcons();
}

function closeModal() {
  if (modalLocked) return;
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
}

function confirmAction(message, onConfirm, confirmLabel = 'Confirmer') {
  openModal(`
    <div class="text-center">
      <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
      </div>
      <p class="text-slate-700 font-medium mb-6">${escapeHtml(message)}</p>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-medium hover:bg-slate-200">Annuler</button>
        <button id="confirm-yes-btn" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-medium hover:bg-red-700">${escapeHtml(confirmLabel)}</button>
      </div>
    </div>
  `);

/* --------------------- 6. INTERPRÉTATION DES CIBLES ---------------------
   Cœur du système : transforme une cible brute (telle que saisie dans les
   fiches Excel) en règle de validation exploitable par l'application.
   Formats supportés :
     "10<p<200"      -> plage [10;200]
     "< 8.5"         -> seuil max 8.5
     "> 2.5bar"      -> seuil min 2.5, unité bar
     "C"             -> conformité attendue
     "<0 = C"        -> seuil numérique (max 0) + info conformité
     "10°<T<25°"     -> plage [10;25] en °
     "?" / ""        -> libre, aucune validation automatique
     "25"            -> valeur cible ponctuelle (informative)
   ------------------------------------------------------------------------- */

function parseTargetExpression(raw) {
  const original = (raw === null || raw === undefined) ? '' : String(raw).trim();
  const result = { targetRaw: original, type: 'numeric', min: null, max: null, target: null, unit: '', label: '' };

  if (original === '' || original === '?' || original === '-' || original === '/') {
    result.label = 'Libre (aucun seuil défini)';
    return result;
  }

  let s = original.replace(/,/g, '.').replace(/\s+/g, ' ').trim();
  const hasDegree = /°/.test(s);

  // Conformité pure : "C", "NC" ou "NA" seuls
  if (/^c$/i.test(s)) {
    result.type = 'conformity';
    result.label = 'Conforme attendu';
    return result;
  }
  if (/^(nc|na)$/i.test(s)) {
    result.type = 'conformity';
    result.label = s.toUpperCase() + ' attendu';
    return result;
  }

  // Cas mixte du type "<0 = C" : on isole la partie numérique
  let mixedHint = null;
  if (s.includes('=')) {
    const parts = s.split('=').map(p => p.trim()).filter(Boolean);
    const cPart = parts.find(p => /^c$/i.test(p));
    const otherPart = parts.find(p => !/^c$/i.test(p));
    if (cPart && otherPart) { mixedHint = 'C'; s = otherPart; }
  }

  // Plage "A < var < B" (var = p, x, T, Δp, etc.)
  let m = s.match(/^(-?\d+(?:\.\d+)?)\s*°?\s*(?:<=|<)\s*[^\d<>=]{1,8}?\s*(?:<=|<)\s*(-?\d+(?:\.\d+)?)\s*°?\s*([a-zA-Zµ%\/]*)$/);
  if (m) {
    result.min = parseFloat(m[1]);
    result.max = parseFloat(m[2]);
    result.unit = m[3] || (hasDegree ? '°' : '');
    result.target = Math.round(((result.min + result.max) / 2) * 100) / 100;
    result.label = `${result.min} à ${result.max}${result.unit ? ' ' + result.unit : ''}`;
    if (mixedHint) result.label += ` (ou ${mixedHint})`;
    return result;
  }

  // Inégalité simple : <, <=, >, >= + nombre + unité optionnelle collée
  m = s.match(/^(<=|>=|<|>)\s*(-?\d+(?:\.\d+)?)\s*([a-zA-Zµ%°\/]*)$/);
  if (m) {
    const op = m[1], val = parseFloat(m[2]);
    result.unit = m[3] || (hasDegree ? '°' : '');
    if (op[0] === '<') result.max = val; else result.min = val;
    result.label = `${op} ${val}${result.unit ? ' ' + result.unit : ''}`;
    if (mixedHint) result.label += ` (ou ${mixedHint})`;
    return result;
  }

  // Valeur ponctuelle simple (ex : "25", "25mm") — informative, sans seuil strict
  m = s.match(/^(-?\d+(?:\.\d+)?)\s*([a-zA-Zµ%°\/]*)$/);
  if (m) {
    result.target = parseFloat(m[1]);
    result.unit = m[2] || (hasDegree ? '°' : '');
    result.label = `${result.target}${result.unit ? ' ' + result.unit : ''}`;
    return result;
  }

  // Format non reconnu : affiché tel quel, aucune validation automatique
  result.label = original;
  return result;
}

/**
 * Détection de type forcé en fonction du LIBELLÉ du point, indépendamment
 * de la cible renseignée. Permet d'identifier automatiquement :
 *  - les signatures électroniques (VISA ...)
 *  - les champs de texte libre (Points de Vigilance, Commentaires...)
 * Utilisé à l'import Excel ET disponible manuellement dans l'éditeur.
 */
function detectForcedType(name) {
  const n = String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/\bvisa\b/.test(n)) return 'signature';
  if (/(vigilance|commentaire|observation|remarque)/.test(n)) return 'text';
  return null;
}

/** Reconstruit un libellé lisible de cible à partir d'un point déjà enregistré */
function formatTargetLabel(p) {
  if (p.type === 'conformity') return 'Conforme attendu';
  if (p.type === 'text') return 'Réponse libre (texte)';
  if (p.type === 'signature') return 'Signature électronique requise';
  const unit = p.unit ? ' ' + p.unit : '';
  if (p.min !== null && p.min !== undefined && p.max !== null && p.max !== undefined) {
    return `${p.min} à ${p.max}${unit}`;
  }
  if (p.max !== null && p.max !== undefined) return `< ${p.max}${unit}`;
  if (p.min !== null && p.min !== undefined) return `> ${p.min}${unit}`;
  if (p.target !== null && p.target !== undefined) return `${p.target}${unit}`;
  return 'Libre (aucun seuil défini)';
}

/** Reconstruit une expression texte par défaut (pour pré-remplir l'éditeur) */
function defaultTargetExprFromPoint(p) {
  if (p.targetRaw) return p.targetRaw;
  if (p.min !== null && p.min !== undefined && p.max !== null && p.max !== undefined) return `${p.min}<x<${p.max}`;
  if (p.max !== null && p.max !== undefined) return `<${p.max}`;
  if (p.min !== null && p.min !== undefined) return `>${p.min}`;
  if (p.target !== null && p.target !== undefined) return `${p.target}`;
  return '';
}

/** Détermine si un point a été renseigné, en fonction de son type */
function isPointAnswered(point, r) {
  switch (point.type) {
    case 'numeric': return r.value !== '';
    case 'text': return r.value !== undefined && r.value !== null && String(r.value).trim() !== '';
    case 'signature': return r.status === 'SIGNED';
    default: return r.status !== null; // conformity
  }
}


/* --------------------------- 7. ACCUEIL / LISTE DES TOURNÉES ------------ */

function renderHome() {
  const grid = document.getElementById('home-tours-grid');
  let inProgress = 0, done = 0, totalAlerts = 0;

  state.tours.forEach(t => {
    const s = state.sessions[t.id];
    if (s) {
      if (s.status === 'completed') done++; else inProgress++;
      totalAlerts += Object.values(s.results).filter(r => r.alert).length;
    }
  });

  document.getElementById('stat-total').textContent = state.tours.length;
  document.getElementById('stat-progress').textContent = inProgress;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-alerts').textContent = totalAlerts;
  applyRoleUI();
  renderHomeBanner();

  if (state.tours.length === 0 && (state.folders || []).length === 0) {
    grid.innerHTML = `
      <div class="col-span-full text-center py-16 text-slate-400">
        <i data-lucide="clipboard-list" class="w-10 h-10 mx-auto mb-3"></i>
        <p class="font-medium">Aucune tournée pour le moment</p>
        <p class="text-sm">Créez-en une ou importez un fichier Excel pour commencer.</p>
      </div>`;
    lucide.createIcons();
    return;
  }

  const renderCard = tour => {
    const session = state.sessions[tour.id];
    const nbPoints = tour.points.length;
    let progress = 0, statusLabel = 'Non démarrée', statusColor = 'slate';

    if (session) {
      const answered = tour.points.filter(p => isPointAnswered(p, session.results[p.id])).length;
      progress = nbPoints ? Math.round((answered / nbPoints) * 100) : 0;
      if (session.status === 'completed') { statusLabel = 'Terminée'; statusColor = 'green'; progress = 100; }
      else { statusLabel = 'En cours'; statusColor = 'amber'; }
    }

    const alerts = session ? Object.values(session.results).filter(r => r.alert).length : 0;

    let actionButtons;
    if (!session) {
      actionButtons = `
        <button onclick="startTour('${tour.id}')" class="flex-1 bg-indigo-600 text-white text-sm font-medium py-2.5 rounded-xl hover:bg-indigo-700 flex items-center justify-center gap-1.5 active:scale-95 transition">
          <i data-lucide="play" class="w-4 h-4"></i> Démarrer
        </button>`;
    } else if (session.status === 'completed') {
      actionButtons = `
        <button onclick="startTour('${tour.id}')" class="flex-1 bg-amber-500 text-white text-sm font-medium py-2.5 rounded-xl hover:bg-amber-600 flex items-center justify-center gap-1.5 active:scale-95 transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Nouveau relevé
        </button>`;
    } else {
      actionButtons = `
        <button onclick="startTour('${tour.id}')" class="flex-1 bg-indigo-600 text-white text-sm font-medium py-2.5 rounded-xl hover:bg-indigo-700 flex items-center justify-center gap-1.5 active:scale-95 transition">
          <i data-lucide="play" class="w-4 h-4"></i> Continuer
        </button>`;
    }

    const manageButtons = can('edit') ? `
          <button onclick="openMoveModal('${tour.id}')" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200" title="Déplacer dans un dossier">
            <i data-lucide="folder-input" class="w-4 h-4"></i>
          </button>
          <button onclick="openDetail('${tour.id}')" class="p-2.5 rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100" title="Historique & KPI">
            <i data-lucide="history" class="w-4 h-4"></i>
          </button>
          <button onclick="openEditor('${tour.id}')" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200" title="Éditer la tournée">
            <i data-lucide="pencil" class="w-4 h-4"></i>
          </button>
          <button onclick="confirmDeleteTour('${tour.id}')" class="p-2.5 rounded-xl bg-slate-100 hover:bg-red-100 hover:text-red-600" title="Supprimer">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        ` : '';

    return `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex flex-col gap-4 hover:shadow-md transition-shadow">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h3 class="font-semibold text-slate-800 truncate">${escapeHtml(tour.name)}</h3>
            <p class="text-xs text-slate-400 mt-0.5">${nbPoints} point(s) de contrôle · ${(state.history[tour.id] || []).length} relevé(s) réalisé(s)</p>
          </div>
          <span class="flex-shrink-0 text-xs font-medium px-2.5 py-1 rounded-full bg-${statusColor}-100 text-${statusColor}-700">${statusLabel}</span>
        </div>
        <div>
          <div class="flex justify-between text-xs text-slate-500 mb-1"><span>Progression</span><span>${progress}%</span></div>
          <div class="w-full bg-slate-100 rounded-full h-2">
            <div class="h-2 rounded-full bg-indigo-500 transition-all" style="width:${progress}%"></div>
          </div>
        </div>
        ${alerts > 0 ? `<div class="flex items-center gap-1.5 text-xs text-red-600 font-medium"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> ${alerts} anomalie(s) détectée(s)</div>` : ''}
        ${pendingVisaChip(tour.id)}
        <div class="flex gap-2 pt-3 border-t border-slate-100">
          ${actionButtons}
          ${manageButtons}
        </div>
      </div>`;
  };

  // --- Regroupement par dossiers ---
  const gridCls = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';
  const folders = state.folders || [];
  let html = '';

  folders.forEach(f => {
    const ts = state.tours.filter(t => t.folderId === f.id);
    const pending = ts.reduce((n, t) => n + pendingVisaCount(t.id), 0);
    const content = f.collapsed ? '' : (ts.length
      ? `<div class="${gridCls}">${ts.map(renderCard).join('')}</div>`
      : `<div class="text-center text-sm text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200 py-6">Dossier vide — déplacez-y des tournées avec l'icône <i data-lucide="folder-input" class="w-4 h-4 inline align-text-bottom"></i> de leur carte.</div>`);
    html += `
      <div>
        <div class="flex items-center gap-2 mb-3">
          <button onclick="toggleFolder('${f.id}')" class="flex items-center gap-2 min-w-0 flex-1 text-left">
            <i data-lucide="${f.collapsed ? 'chevron-right' : 'chevron-down'}" class="w-4 h-4 text-slate-400 flex-shrink-0"></i>
            <i data-lucide="${f.collapsed ? 'folder' : 'folder-open'}" class="w-5 h-5 text-indigo-500 flex-shrink-0"></i>
            <span class="font-semibold text-slate-700 truncate">${escapeHtml(f.name)}</span>
            <span class="text-xs text-slate-400 flex-shrink-0">${ts.length} tournée(s)</span>
            ${pending > 0 && can('visa') ? `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 flex-shrink-0">${pending} à viser</span>` : ''}
          </button>
          ${can('edit') ? `<button onclick="renameFolder('${f.id}')" class="p-2 rounded-xl hover:bg-slate-100" title="Renommer le dossier"><i data-lucide="pencil" class="w-4 h-4 text-slate-500"></i></button>
          <button onclick="confirmDeleteFolder('${f.id}')" class="p-2 rounded-xl hover:bg-red-100" title="Supprimer le dossier"><i data-lucide="trash-2" class="w-4 h-4 text-red-500"></i></button>` : ''}
        </div>
        ${content}
      </div>`;
  });

  const loose = state.tours.filter(t => !t.folderId || !folders.some(f => f.id === t.folderId));
  if (loose.length) {
    html += `
      <div>
        ${folders.length ? `<div class="flex items-center gap-2 mb-3"><i data-lucide="inbox" class="w-5 h-5 text-slate-400"></i><span class="font-semibold text-slate-700">Sans dossier</span><span class="text-xs text-slate-400">${loose.length} tournée(s)</span></div>` : ''}
        <div class="${gridCls}">${loose.map(renderCard).join('')}</div>
      </div>`;
  }

  grid.innerHTML = html;
  lucide.createIcons();
}

function confirmDeleteTour(tourId) {
  if (!requirePerm('edit')) return;
  confirmAction("Supprimer définitivement cette tournée ainsi que son historique de relevés ?", () => {
    state.tours = state.tours.filter(t => t.id !== tourId);
    delete state.sessions[tourId];
    delete state.history[tourId];
    saveState();
    renderHome();
    toast('Tournée supprimée', 'success');
  });
}

/** Analyse en direct la cible saisie et met à jour l'aperçu + les champs avancés */
function previewTargetExpr() {
  const exprInput = document.getElementById('pf-target-expr');
  const preview = document.getElementById('pf-target-preview');
  if (!exprInput) return;

  const parsed = parseTargetExpression(exprInput.value);
  const minInput = document.getElementById('pf-min');
  const maxInput = document.getElementById('pf-max');
  const unitInput = document.getElementById('pf-unit');

  if (minInput) minInput.value = parsed.min ?? '';
  if (maxInput) maxInput.value = parsed.max ?? '';
  if (unitInput && parsed.unit) unitInput.value = parsed.unit;

  if (preview) {
    if (parsed.type === 'conformity') {
      preview.textContent = '⚠️ Cette cible ressemble à une conformité (C). Pensez à sélectionner "Conformité" comme type si besoin.';
      preview.className = 'text-xs text-amber-600 mt-1.5 min-h-[1rem]';
    } else {
      preview.textContent = '→ Interprété comme : ' + parsed.label;
      preview.className = 'text-xs text-indigo-600 mt-1.5 min-h-[1rem]';
    }
  }
}

function savePoint(pointId) {
  const tour = getCurrentTour();
  const name = document.getElementById('pf-name').value.trim();
  const type = document.getElementById('pf-type').value;
  const numberVal = document.getElementById('pf-number').value.trim();

  if (!name) { toast('La désignation du point est requise', 'error'); return; }

  let pointData = { name, type, number: numberVal || null };

  if (type === 'numeric') {
    const targetExpr = document.getElementById('pf-target-expr').value.trim();
    const parsed = parseTargetExpression(targetExpr);
    const minField = document.getElementById('pf-min').value;
    const maxField = document.getElementById('pf-max').value;
    const unitField = document.getElementById('pf-unit').value.trim();

    pointData.targetRaw = targetExpr;
    pointData.unit = unitField || parsed.unit || '';
    pointData.min = minField !== '' ? parseFloat(minField) : (parsed.min ?? null);
    pointData.max = maxField !== '' ? parseFloat(maxField) : (parsed.max ?? null);
    pointData.target = parsed.target ?? null;

    if (pointData.min !== null && pointData.max !== null && pointData.min > pointData.max) {
      toast('Le seuil min doit être inférieur ou égal au seuil max', 'error');
      return;
    }
  } else if (type === 'conformity') {
    pointData.targetRaw = 'C';
    pointData.unit = ''; pointData.min = null; pointData.max = null; pointData.target = null;
  } else if (type === 'text') {
    pointData.targetRaw = 'Texte libre';
    pointData.unit = ''; pointData.min = null; pointData.max = null; pointData.target = null;
  } else if (type === 'signature') {
    pointData.targetRaw = 'Signature électronique';
    pointData.unit = ''; pointData.min = null; pointData.max = null; pointData.target = null;
  }

  if (pointId) {
    const existing = tour.points.find(p => p.id === pointId);
    Object.assign(existing, pointData);
    toast('Point modifié', 'success');
  } else {
    pointData.id = genId();
    tour.points.push(pointData);
    toast('Point ajouté', 'success');
  }

  saveState();
  closeModal();
  renderEditorPoints();
}

function deletePoint(pointId) {
  confirmAction('Supprimer ce point de contrôle ?', () => {
    const tour = getCurrentTour();
    tour.points = tour.points.filter(p => p.id !== pointId);
    saveState();
    renderEditorPoints();
    toast('Point supprimé', 'success');
  });
}


/* --------------------------- 9. IMPORT EXCEL ---------------------------- */

async function handleExcelImport(event) {
  if (!requirePerm('edit')) return;
  const file = event.target.files[0];
  if (!file) return;

  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, { type: 'array' });

    if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
      toast("Le fichier ne contient aucune feuille exploitable.", 'error');
      return;
    }

    let importedCount = 0;
    const importedIds = [];
    const skippedSheets = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });

      // 1) Tentative avec le format réel "Désignation + Cible" (zones multiples supportées)
      let tours = parseSheetIntoTours(aoa, sheetName);

      // 2) Repli : ancien format à colonnes nommées (désignation/type/min/max/unité séparés)
      if (tours.length === 0) {
        const legacyPoints = parseSheetToPointsLegacy(aoa);
        if (legacyPoints.length > 0) {
          tours = [{ id: genId(), name: sheetName.trim() || 'Zone importée', description: '', createdAt: Date.now(), points: legacyPoints }];
        }
      }

      if (tours.length > 0) {
        tours.forEach(t => {
          t.description = t.description || `Importé depuis "${file.name}" (onglet "${sheetName}")`;
          state.tours.push(t);
          importedIds.push(t.id);
        });
        importedCount += tours.length;
      } else {
        skippedSheets.push(sheetName);
      }
    });

    saveState();
    renderHome();

    if (importedCount > 0) {
      toast(`${importedCount} tournée(s) importée(s) avec succès`, 'success');
      if (importedIds.length >= 2) proposeFolderForImport(importedIds, file.name);
      if (skippedSheets.length > 0) {
        toast(`Feuilles ignorées (format non reconnu) : ${skippedSheets.join(', ')}`, 'warning');
      }
    } else {
      toast("Aucune donnée exploitable trouvée dans ce fichier. Vérifiez la structure du classeur.", 'error');
    }
  } catch (err) {
    console.error(err);
    toast("Erreur lors de la lecture du fichier Excel. Le fichier est peut-être corrompu ou dans un format non supporté.", 'error');
  } finally {
    event.target.value = '';
  }
}

/** Sépare un numéro d'ordre collé en début de désignation ("1 Relever...") */
function splitNumberAndName(text) {
  const s = String(text || '').trim();
  const m = s.match(/^(\d{1,3})[\.\)\-\s]+(.+)$/);
  if (m) return { number: m[1], name: m[2].trim() };
  return { number: null, name: s };
}

/** Lignes d'en-tête générales / vides à ignorer lors du parcours de la feuille */
const HEADER_EXACT_LABELS = [
  'jour de passage', 'points de contrôle et/ou relevés', 'point de contrôle et/ou relevés',
  'cible', 'points de contrôle', 'point de contrôle', 'relevés', 'points de contrôle et/ou relevé'
];
function isHeaderOrEmptyRow(row) {
  const nonEmpty = row.map(c => String(c || '').trim()).filter(Boolean);
  if (nonEmpty.length === 0) return true;
  return nonEmpty.every(cell => HEADER_EXACT_LABELS.includes(cell.toLowerCase().replace(/\s+/g, ' ')));
}

/** Détecte une ligne d'en-tête de zone (ex : "ZONE A25 - Station CHRIST") */
function isZoneHeaderRow(row) {
  const joined = row.map(c => String(c || '').trim()).filter(Boolean).join(' - ');
  if (!joined) return false;
  return /^zone\b/i.test(joined) || /^secteur\b/i.test(joined);
}

/**
 * Tente d'interpréter une ligne comme un point de contrôle :
 * - 1ère cellule non vide = numéro (si purement numérique et colonne séparée) ou désignation
 * - cellule non vide suivante = cible brute
 * Applique ensuite la détection forcée de type (texte libre / signature).
 */
function tryParseDataRow(row) {
  const cells = row.map(c => (c === undefined || c === null) ? '' : c);
  const nonEmptyIdx = [];
  cells.forEach((c, i) => { if (String(c).trim() !== '') nonEmptyIdx.push(i); });
  if (nonEmptyIdx.length === 0) return null;

  let ptr = 0;
  let number = null;

  const firstVal = String(cells[nonEmptyIdx[0]]).trim();
  if (/^\d{1,3}$/.test(firstVal) && nonEmptyIdx.length >= 2) {
    number = firstVal;
    ptr = 1;
  }

  if (ptr >= nonEmptyIdx.length) return null;
  const nameIdx = nonEmptyIdx[ptr];
  let nameCellRaw = String(cells[nameIdx]).trim();

  if (number === null) {
    const split = splitNumberAndName(nameCellRaw);
    number = split.number;
    nameCellRaw = split.name;
  }

  if (!nameCellRaw) return null;

  const targetPos = nonEmptyIdx.findIndex(i => i === nameIdx) + 1;
  const targetIdx = nonEmptyIdx[targetPos];
  const targetRaw = targetIdx !== undefined ? cells[targetIdx] : '';

  const parsed = parseTargetExpression(targetRaw);

  let type = parsed.type;
  let unit = parsed.unit, target = parsed.target, min = parsed.min, max = parsed.max;
  let targetRawFinal = parsed.targetRaw;

  // Détection forcée : signature électronique / texte libre, prioritaire sur la cible
  const forced = detectForcedType(nameCellRaw);
  if (forced) {
    type = forced;
    unit = ''; target = null; min = null; max = null;
    targetRawFinal = forced === 'signature' ? 'Signature électronique' : 'Texte libre';
  }

  return {
    id: genId(),
    number,
    name: nameCellRaw,
    type,
    targetRaw: targetRawFinal,
    unit,
    target,
    min,
    max
  };
}

/**
 * Parcourt une feuille ligne par ligne, détecte les sections "ZONE ..." et
 * construit une tournée par zone rencontrée (plusieurs zones possibles
 * dans une même feuille Excel).
 */
function parseSheetIntoTours(aoa, fallbackName) {
  const tours = [];
  let currentZoneName = null;
  let currentPoints = [];
  let zoneFound = false;

  function flush() {
    if (currentZoneName && currentPoints.length > 0) {
      tours.push({
        id: genId(), name: currentZoneName, description: '',
        createdAt: Date.now(), points: currentPoints
      });
    }
    currentPoints = [];
  }

  for (let i = 0; i < aoa.length; i++) {
    const row = aoa[i] || [];
    if (isHeaderOrEmptyRow(row)) continue;

    if (isZoneHeaderRow(row)) {
      flush();
      currentZoneName = row.map(c => String(c || '').trim()).filter(Boolean).join(' - ');
      zoneFound = true;
      continue;
    }

    const point = tryParseDataRow(row);
    if (point) {
      if (!zoneFound) currentZoneName = currentZoneName || fallbackName;
      currentPoints.push(point);
    }
  }
  flush();
  return tours;
}

/**
 * Repli : ancien format à colonnes nommées explicitement
 * (désignation / type / cible / min / max / unité en colonnes séparées).
 */
function parseSheetToPointsLegacy(aoa) {
  const points = [];
  if (!aoa || aoa.length === 0) return points;

  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

  const colKeywords = {
    name:   ['point de controle', 'designation', 'libelle', 'description', 'point', 'parametre', 'organe'],
    type:   ['type', 'nature'],
    target: ['cible', 'valeur cible', 'consigne', 'valeur de reference'],
    min:    ['min', 'seuil min', 'minimum', 'mini'],
    max:    ['max', 'seuil max', 'maximum', 'maxi'],
    unit:   ['unite', 'unit']
  };

  let headerRowIndex = -1;
  let colMap = {};

  for (let i = 0; i < Math.min(aoa.length, 10); i++) {
    const row = (aoa[i] || []).map(norm);
    const tempMap = {};
    row.forEach((cell, idx) => {
      for (const key in colKeywords) {
        if (tempMap[key] !== undefined) continue;
        if (colKeywords[key].some(kw => cell.includes(kw))) tempMap[key] = idx;
      }
    });
    if (tempMap.name !== undefined && (tempMap.min !== undefined || tempMap.max !== undefined || tempMap.target !== undefined)) {
      headerRowIndex = i;
      colMap = tempMap;
      break;
    }
  }

  if (headerRowIndex === -1) return points; // pas de format legacy détecté

  for (let i = headerRowIndex + 1; i < aoa.length; i++) {
    const row = aoa[i];
    if (!row || row.length === 0) continue;

    const nameVal = row[colMap.name];
    if (nameVal === undefined || String(nameVal).trim() === '') continue;

    const typeRaw = colMap.type !== undefined ? norm(row[colMap.type]) : '';
    const targetVal = colMap.target !== undefined ? row[colMap.target] : '';
    const minVal = colMap.min !== undefined ? row[colMap.min] : '';
    const maxVal = colMap.max !== undefined ? row[colMap.max] : '';
    const unitVal = colMap.unit !== undefined ? row[colMap.unit] : '';

    let type = 'numeric';
    if (typeRaw.includes('conform') || typeRaw.includes('c/nc') ||
        (!isNumeric(targetVal) && !isNumeric(minVal) && !isNumeric(maxVal) && String(targetVal).trim() !== '')) {
      type = 'conformity';
    }

    const { number, name } = splitNumberAndName(String(nameVal).trim());
    const point = { id: genId(), number, name, type };

    if (type === 'numeric') {
      point.unit = unitVal !== undefined ? String(unitVal).trim() : '';
      point.target = isNumeric(targetVal) ? parseFloat(targetVal) : null;
      point.min = isNumeric(minVal) ? parseFloat(minVal) : null;
      point.max = isNumeric(maxVal) ? parseFloat(maxVal) : null;
      point.targetRaw = defaultTargetExprFromPoint(point);
    } else {
      point.unit = ''; point.target = null; point.min = null; point.max = null;
      point.targetRaw = 'C';
    }

    // Détection forcée : signature électronique / texte libre
    const forced = detectForcedType(name);
    if (forced) {
      point.type = forced;
      point.unit = ''; point.target = null; point.min = null; point.max = null;
      point.targetRaw = forced === 'signature' ? 'Signature électronique' : 'Texte libre';
    }

    points.push(point);
  }

  return points;
}


/* --------------------------- 10. PASSAGE DE TOURNÉE ---------------------- */

function emptyResult() { return { value: '', status: null, comment: '', photo: null, alert: false, signedAt: null }; }

function createEmptySession(tour) {
  return {
    tourId: tour.id,
    operator: currentUser ? currentUser.displayName : '',
    date: new Date().toISOString(),
    status: 'in_progress',
    completedAt: null,
    results: Object.fromEntries(tour.points.map(p => [p.id, emptyResult()]))
  };
}

function startTour(tourId) {
  currentTourId = tourId;
  const tour = state.tours.find(t => t.id === tourId);
  const existing = state.sessions[tourId];

  if (!existing || existing.status === 'completed') {
    state.sessions[tourId] = createEmptySession(tour);
  } else {
    tour.points.forEach(p => { if (!existing.results[p.id]) existing.results[p.id] = emptyResult(); });
  }

  saveState();
  showView('execution');
  renderExecution();
}

function renderExecution() {
  const tour = getCurrentTour();
  const session = state.sessions[currentTourId];

  document.getElementById('exec-tour-name').textContent = tour.name;
  if (!session.operator && currentUser) session.operator = currentUser.displayName;
  const opEl = document.getElementById('exec-operator');
  opEl.value = session.operator || '';
  opEl.readOnly = true;
  opEl.classList.add('bg-slate-50', 'text-slate-500');
  document.getElementById('exec-date').value = (session.date || new Date().toISOString()).substring(0, 10);
  document.getElementById('exec-points-list').innerHTML = tour.points.map(p => renderPointCard(p)).join('');

  lucide.createIcons();
  updateProgress();
}

function getAnsweredIcon(point, r) {
  const answered = isPointAnswered(point, r);
  if (!answered) return `<i data-lucide="circle" class="w-5 h-5 text-slate-300"></i>`;
  if (r.alert) return `<i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i>`;
  if (point.type === 'signature') return `<i data-lucide="shield-check" class="w-5 h-5 text-green-500"></i>`;
  return `<i data-lucide="check-circle-2" class="w-5 h-5 text-green-500"></i>`;
}

function renderPointCard(point) {
  const session = state.sessions[currentTourId];
  const r = session.results[point.id];
  const cardBorder = r.alert ? 'border-red-300 ring-1 ring-red-100' : 'border-slate-100';
  const numberBadge = point.number ? `<span class="text-slate-400 mr-1">${escapeHtml(point.number)}.</span>` : '';

  let body;

  if (point.type === 'numeric') {
    const rangeText = 'Cible : ' + formatTargetLabel(point);
    const inputClasses = r.alert
      ? 'border-red-400 bg-red-50 text-red-700'
      : 'border-slate-200 focus:border-indigo-400 text-slate-800';

    body = `
      <p class="text-xs text-slate-400 mt-0.5">${escapeHtml(rangeText)}</p>
      <div class="mt-3 flex items-center gap-2">
        <input id="input-${point.id}" type="number" step="any" inputmode="decimal" value="${r.value}"
          oninput="updateNumericValue('${point.id}', this.value)"
          class="flex-1 border-2 rounded-xl px-3 py-3 text-lg font-semibold text-center transition-colors outline-none ${inputClasses}"
          placeholder="Valeur">
        <span class="text-sm text-slate-400 font-medium w-14 text-left">${escapeHtml(point.unit || '')}</span>
      </div>`;

  } else if (point.type === 'conformity') {
    body = `
      <div class="flex gap-2 mt-3">
        <button onclick="setConformity('${point.id}','C')" class="flex-1 py-3 rounded-xl font-bold border-2 transition-colors ${r.status === 'C' ? 'bg-green-500 text-white border-green-500' : 'border-slate-200 text-slate-400 hover:border-green-300'}">C</button>
        <button onclick="setConformity('${point.id}','NC')" class="flex-1 py-3 rounded-xl font-bold border-2 transition-colors ${r.status === 'NC' ? 'bg-red-500 text-white border-red-500' : 'border-slate-200 text-slate-400 hover:border-red-300'}">NC</button>
        <button onclick="setConformity('${point.id}','NA')" class="flex-1 py-3 rounded-xl font-bold border-2 transition-colors ${r.status === 'NA' ? 'bg-slate-400 text-white border-slate-400' : 'border-slate-200 text-slate-400 hover:border-slate-300'}">NA</button>
      </div>`;

  } else if (point.type === 'text') {
    body = `
      <p class="text-xs text-slate-400 mt-0.5">Réponse libre</p>
      <textarea id="input-${point.id}" rows="2" oninput="updateTextValue('${point.id}', this.value)"
        class="w-full mt-2 border-2 border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-indigo-400 resize-none transition-colors"
        placeholder="Saisir un commentaire, une observation...">${escapeHtml(r.value)}</textarea>`;

  } else if (point.type === 'signature') {
    if (r.status === 'SIGNED') {
      // Signature verrouillée : non modifiable, horodatage affiché
      body = `
        <div class="mt-3 bg-green-50 border-2 border-green-200 rounded-xl px-3.5 py-3 flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-green-500 text-white flex items-center justify-center flex-shrink-0">
            <i data-lucide="shield-check" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <p class="font-semibold text-green-800 truncate">${escapeHtml(r.value)}</p>
            <p class="text-xs text-green-600">Signé électroniquement le ${formatDate(r.signedAt)}</p>
          </div>
        </div>`;
    } else if (!canSignPoint(point)) {
      body = `
        <div class="mt-3 bg-amber-50 border-2 border-amber-200 rounded-xl px-3.5 py-3 flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-amber-500 text-white flex items-center justify-center flex-shrink-0">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </div>
          <p class="text-sm text-amber-800 font-medium">Visa réservé à un compte Manager. Il sera apposé après la tournée.</p>
        </div>`;
    } else {
      const signerName = currentUser ? currentUser.displayName : '';
      if (r.value !== signerName) r.value = signerName;
      const canSign = signerName.trim() !== '';
      body = `
        <p class="text-xs text-slate-400 mt-0.5">Signature électronique requise</p>
        <div class="mt-2 space-y-2">
          <input id="input-${point.id}" type="text" value="${escapeHtml(r.value)}" readonly
            class="w-full border-2 border-slate-200 bg-slate-50 text-slate-600 rounded-xl px-3 py-3 text-sm font-medium outline-none">
          <button id="sign-btn-${point.id}" onclick="confirmSignature('${point.id}')" ${canSign ? '' : 'disabled'}
            class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold flex items-center justify-center gap-2 hover:bg-indigo-700 active:scale-[0.98] transition disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100">
            <i data-lucide="pen-tool" class="w-4 h-4"></i> Signer en tant que ${escapeHtml(signerName)}
          </button>
        </div>`;
    }
  }

  const alertSection = (point.type === 'numeric' || point.type === 'conformity') ? `
    <div id="alert-section-${point.id}" class="mt-3 pt-3 border-t border-red-100 space-y-2 ${r.alert ? '' : 'hidden'}">
      <div class="flex items-center gap-1.5 text-xs font-semibold text-red-600">
        <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Anomalie — merci de commenter
      </div>
      <textarea oninput="updateComment('${point.id}', this.value)" placeholder="Décrire l'anomalie, action corrective engagée..."
        class="w-full text-sm border border-red-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-red-200 resize-none" rows="2">${escapeHtml(r.comment || '')}</textarea>
      <div class="flex items-center gap-2 flex-wrap">
        <label class="cursor-pointer flex items-center gap-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 px-3 py-2.5 rounded-xl transition-colors">
          <i data-lucide="camera" class="w-4 h-4"></i> Photo
          <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload('${point.id}', this)">
        </label>
        ${r.photo ? `<img src="${r.photo}" class="w-14 h-14 object-cover rounded-lg border border-slate-200 cursor-pointer" onclick="viewPhoto('${r.photo}')">` : ''}
        ${r.photo ? `<button onclick="removePhoto('${point.id}')" class="text-xs text-red-500 font-medium hover:underline">Supprimer</button>` : ''}
      </div>
    </div>` : '';

  return `
    <div id="point-card-${point.id}" class="bg-white rounded-2xl shadow-sm border ${cardBorder} p-4 transition-colors">
      <div class="flex items-start justify-between gap-2">
        <p class="font-medium text-slate-800 leading-snug">${numberBadge}${escapeHtml(point.name)}</p>
        <span class="flex-shrink-0 mt-0.5">${getAnsweredIcon(point, r)}</span>
      </div>
      ${body}
      ${alertSection}
    </div>`;
}

function refreshPointCard(pointId) {
  const tour = getCurrentTour();
  const point = tour.points.find(p => p.id === pointId);
  const el = document.getElementById('point-card-' + pointId);
  if (el) { el.outerHTML = renderPointCard(point); lucide.createIcons(); }
}

function updateNumericValue(pointId, rawValue) {
  const tour = getCurrentTour();
  const point = tour.points.find(p => p.id === pointId);
  const session = state.sessions[currentTourId];
  const r = session.results[pointId];

  r.value = rawValue;
  const num = parseFloat(rawValue);
  let alert = false;

  if (rawValue !== '' && !isNaN(num)) {
    if (point.min !== null && point.min !== undefined && num < point.min) alert = true;
    if (point.max !== null && point.max !== undefined && num > point.max) alert = true;
  }
  r.alert = alert;
  saveState();

  const input = document.getElementById('input-' + pointId);
  input.classList.toggle('border-red-400', alert);
  input.classList.toggle('bg-red-50', alert);
  input.classList.toggle('text-red-700', alert);
  input.classList.toggle('border-slate-200', !alert);

  const card = document.getElementById('point-card-' + pointId);
  card.classList.toggle('border-red-300', alert);
  card.classList.toggle('ring-1', alert);
  card.classList.toggle('ring-red-100', alert);
  card.classList.toggle('border-slate-100', !alert);

  const alertSection = document.getElementById('alert-section-' + pointId);
  if (alertSection) alertSection.classList.toggle('hidden', !alert);

  const iconSpan = card.querySelector('span.flex-shrink-0');
  if (iconSpan) { iconSpan.innerHTML = getAnsweredIcon(point, r); lucide.createIcons(); }

  updateProgress();
}

/** Saisie pour les champs de texte libre ET pour le nom du signataire (avant validation) */
function updateTextValue(pointId, value) {
  const tour = getCurrentTour();
  const point = tour.points.find(p => p.id === pointId);
  const session = state.sessions[currentTourId];
  const r = session.results[pointId];

  r.value = value;
  saveState();

  // Active/désactive le bouton de signature en direct
  if (point.type === 'signature') {
    const btn = document.getElementById('sign-btn-' + pointId);
    if (btn) btn.disabled = !value || value.trim() === '';
  }

  const card = document.getElementById('point-card-' + pointId);
  if (card) {
    const iconSpan = card.querySelector('span.flex-shrink-0');
    if (iconSpan) { iconSpan.innerHTML = getAnsweredIcon(point, r); lucide.createIcons(); }
  }

  updateProgress();
}

function updateComment(pointId, value) {
  state.sessions[currentTourId].results[pointId].comment = value;
  saveState();
}

function setConformity(pointId, status) {
  const session = state.sessions[currentTourId];
  const r = session.results[pointId];
  r.status = status;
  r.alert = status === 'NC';
  saveState();
  refreshPointCard(pointId);
  updateProgress();
}

/** Valide définitivement une signature électronique (irréversible, horodatée) */
function confirmSignature(pointId) {
  const session = state.sessions[currentTourId];
  const r = session.results[pointId];
  const sigPoint = getCurrentTour().points.find(p => p.id === pointId);
  if (!currentUser || !sigPoint || !canSignPoint(sigPoint)) { toast('Ce visa est réservé à un compte Manager', 'error'); return; }
  r.value = currentUser.displayName;

  if (!r.value || !r.value.trim()) {
    toast('Veuillez saisir un nom avant de signer', 'error');
    return;
  }

  confirmAction(
    `Confirmer la signature électronique de « ${r.value.trim()} » ? Cette action est définitive, horodatée, et ne pourra plus être modifiée.`,
    () => {
      r.status = 'SIGNED';
      r.signedAt = new Date().toISOString();
      r.signedBy = currentUser.id;
      r.alert = false;
      saveState();
      refreshPointCard(pointId);
      updateProgress();
      toast('Signature validée et horodatée', 'success');
    },
    'Signer'
  );
}

function handlePhotoUpload(pointId, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

      state.sessions[currentTourId].results[pointId].photo = dataUrl;
      saveState();
      refreshPointCard(pointId);
      toast('Photo ajoutée', 'success');
    };
    img.onerror = () => toast("Impossible de traiter cette image", 'error');
    img.src = e.target.result;
  };
  reader.onerror = () => toast("Erreur de lecture du fichier image", 'error');
  reader.readAsDataURL(file);
  inputEl.value = '';
}

function removePhoto(pointId) {
  state.sessions[currentTourId].results[pointId].photo = null;
  saveState();
  refreshPointCard(pointId);
}

function updateOperator() {

function updateSessionDate() {

function updateProgress() {
  const tour = getCurrentTour();
  const session = state.sessions[currentTourId];
  const total = tour.points.length;

  const answered = tour.points.filter(p => isPointAnswered(p, session.results[p.id])).length;

  const pct = total ? Math.round((answered / total) * 100) : 0;
  document.getElementById('exec-progress-bar').style.width = pct + '%';
  document.getElementById('exec-progress-text').textContent = `${pct}% (${answered}/${total})`;
}

function finishTour() {

/* --------------------------- 11b. HISTORIQUE & KPI ---------------------- */

let detailTab = 'history';
let detailPeriod = 'all';
let detailPointId = '';

/** Archive un relevé terminé (copie figée des points + résultats) dans l'historique de la tournée */
function archiveSession(tour, session) {
  if (!state.history) state.history = {};
  if (!state.history[tour.id]) state.history[tour.id] = [];
  const entry = {
    id: genId(),
    tourId: tour.id,
    tourName: tour.name,
    status: 'completed',
    operator: session.operator || '',
    date: session.date,
    completedAt: session.completedAt || new Date().toISOString(),
    points: JSON.parse(JSON.stringify(tour.points)),
    results: JSON.parse(JSON.stringify(session.results))
  };
  state.history[tour.id].push(entry);
  session.archivedId = entry.id;
  // Les photos sont conservées uniquement dans l'historique (évite de doubler le stockage)
  Object.values(session.results).forEach(r => { r.photo = null; });
  return entry;
}

function getHistory(tourId) {
  return (state.history[tourId] || []).slice()
    .sort((a, b) => new Date(a.completedAt || a.date) - new Date(b.completedAt || b.date));
}

function findEntry(id) {
  return (state.history[currentTourId] || []).find(e => e.id === id);
}

function openDetail(tourId, tab) {
  if (!requirePerm('history')) return;
  currentTourId = tourId;
  detailTab = tab || 'history';
  detailPointId = '';
  showView('detail');
}

function setDetailTab(tab) { detailTab = tab; renderDetail(); }
function setDetailPeriod(v) { detailPeriod = v; detailPointId = ''; renderDetail(); }
function setDetailPoint(v) { detailPointId = v; renderDetail(); }

/** Calcule les indicateurs d'un relevé archivé */
function evalEntry(e) {
  const total = e.points.length;
  let answered = 0, ok = 0, nok = 0, anomalies = 0, sigTotal = 0, sigDone = 0;
  e.points.forEach(p => {
    const r = e.results[p.id] || emptyResult();
    if (isPointAnswered(p, r)) answered++;
    if (p.type === 'signature') { sigTotal++; if (r.status === 'SIGNED') sigDone++; }
    if (p.type === 'numeric') {
      const hasThreshold = (p.min !== null && p.min !== undefined) || (p.max !== null && p.max !== undefined);
      if (hasThreshold && r.value !== '') { if (r.alert) nok++; else ok++; }
    } else if (p.type === 'conformity') {
      if (r.status === 'C') ok++; else if (r.status === 'NC') nok++;
    }
    if (r.alert) anomalies++;
  });
  return {
    total, answered, ok, nok, anomalies, sigTotal, sigDone,
    exec: total ? (answered / total) * 100 : 0,
    conf: (ok + nok) > 0 ? (ok / (ok + nok)) * 100 : null
  };
}

function pctText(v) { return (v === null || v === undefined || isNaN(v)) ? '—' : Math.round(v) + ' %'; }
function rateColor(v) {
  if (v === null || v === undefined) return 'text-slate-400';
  if (v >= 95) return 'text-green-600';
  if (v >= 80) return 'text-amber-500';
  return 'text-red-500';
}
function shortDate(iso) {
  return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}

function renderDetail() {
  const tour = getCurrentTour();
  if (!tour) { showView('home'); return; }
  const hist = getHistory(tour.id);

  document.getElementById('detail-tour-name').textContent = tour.name;
  document.getElementById('detail-tour-meta').textContent =
    `${hist.length} relevé(s) réalisé(s) · ${tour.points.length} point(s) de contrôle`;

  const active = 'bg-white text-indigo-600 shadow-sm';
  const inactive = 'text-slate-500 hover:text-slate-700';
  ['history', 'kpi'].forEach(t => {
    document.getElementById('tab-btn-' + t).className =
      'flex-1 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-1.5 transition ' +
      (detailTab === t ? active : inactive);
  });

  document.getElementById('detail-content').innerHTML =
    detailTab === 'history' ? renderHistoryTab(tour, hist) : renderKpiTab(tour, hist);
  lucide.createIcons();
}

          <div class="bg-slate-50 rounded-xl py-2"><p class="text-[11px] text-slate-400">Conformité</p><p class="font-bold ${rateColor(s.conf)}">${pctText(s.conf)}</p></div>

          </button>
          <button onclick="deleteEntry('${e.id}')" class="p-2.5 rounded-xl bg-slate-100 hover:bg-red-100 hover:text-red-600" title="Supprimer ce relevé">

  return `
    <div class="flex justify-end mb-3">
